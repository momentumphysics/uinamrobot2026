<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ESP32 Local Controller</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #121212;
      color: #e0e0e0;
      display: flex;
      justify-content: center;
      padding: 20px;
    }
    .card {
      background: #1e1e1e;
      padding: 24px;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.5);
      width: 100%;
      max-width: 450px;
    }
    h2 { margin-top: 0; color: #40c4ff; text-align: center; }

    .status-container {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #2a2a2a;
      padding: 10px 14px;
      border-radius: 8px;
      margin-bottom: 16px;
    }
    .status-badge { display: flex; align-items: center; gap: 8px; font-weight: bold; font-size: 0.9em; }
    .status-dot {
      width: 12px; height: 12px; border-radius: 50%;
      background-color: #757575;
      box-shadow: 0 0 8px rgba(0,0,0,0.5);
    }
    .status-dot.online  { background-color: #00e676; box-shadow: 0 0 10px #00e676; }
    .status-dot.offline { background-color: #ff1744; box-shadow: 0 0 10px #ff1744; }

    .input-group { margin-bottom: 16px; }
    label { display: block; margin-bottom: 6px; font-weight: 600; }
    input[type="text"] {
      width: 100%; padding: 8px; border-radius: 6px; border: 1px solid #333;
      background: #2a2a2a; color: #fff; box-sizing: border-box;
    }
    .slider-container { margin-bottom: 20px; background: #282828; padding: 12px; border-radius: 8px; }
    .slider-header { display: flex; justify-content: space-between; margin-bottom: 8px; }
    input[type="range"] { width: 100%; accent-color: #00e676; touch-action: none; }
    input[type="range"]:disabled { opacity: 0.4; cursor: not-allowed; }
    .btn-reset {
      width: 100%; padding: 10px; border: none; border-radius: 6px;
      background: #ff5252; color: white; font-weight: bold; cursor: pointer;
    }
    .btn-reset:hover { background: #ff1744; }
    .btn-reset:disabled { background: #555; cursor: not-allowed; }
  </style>
</head>
<body>

<div class="card">
  <h2>Control Dashboard</h2>

  <div class="status-container">
    <span>Status Koneksi:</span>
    <div class="status-badge">
      <div id="statusDot" class="status-dot"></div>
      <span id="statusText">CONNECTING...</span>
    </div>
  </div>

  <div class="input-group">
    <label for="espIp">IP Address ESP32:</label>
    <input type="text" id="espIp" placeholder="Contoh: 192.168.1.15" value="192.168.1.100">
  </div>

  <hr style="border-color: #333; margin: 20px 0;">

  <div class="slider-container">
    <div class="slider-header"><span>Servo 2 (GPIO 4)</span><span id="valS2">90°</span></div>
    <input type="range" class="ctrl-input" id="sliderS2" min="0" max="180" value="90">
  </div>

  <div class="slider-container">
    <div class="slider-header"><span>Servo 3 (GPIO 16)</span><span id="valS3">90°</span></div>
    <input type="range" class="ctrl-input" id="sliderS3" min="0" max="180" value="90">
  </div>

  <div class="slider-container">
    <div class="slider-header"><span>Maju / Mundur (Throttle)</span><span id="valThrottle">0</span></div>
    <input type="range" class="ctrl-input" id="sliderThrottle" min="-255" max="255" value="0">
  </div>

  <div class="slider-container">
    <div class="slider-header"><span>Kiri / Kanan (Steering)</span><span id="valSteering">0</span></div>
    <input type="range" class="ctrl-input" id="sliderSteering" min="-255" max="255" value="0">
  </div>

  <button class="btn-reset ctrl-input" id="btnReset" onclick="resetDrive()">STOP KENDARAAN</button>
</div>

<script>
  const WS_PORT = 81;
  const SEND_INTERVAL_MS = 33;   // ~30 Hz; also acts as heartbeat for the ESP32 failsafe

  const ipInput = document.getElementById('espIp');
  const sliderS2 = document.getElementById('sliderS2');
  const sliderS3 = document.getElementById('sliderS3');
  const sliderThrottle = document.getElementById('sliderThrottle');
  const sliderSteering = document.getElementById('sliderSteering');
  const ctrlInputs = document.querySelectorAll('.ctrl-input');
  const statusDot = document.getElementById('statusDot');
  const statusText = document.getElementById('statusText');

  let ws = null;
  let reconnectTimer = null;

  // ---------- CONNECTION ----------
  function setStatus(state) {  // 'connecting' | 'online' | 'offline'
    const online = state === 'online';
    statusDot.className = 'status-dot ' + (state === 'connecting' ? '' : state);
    statusText.innerText = state.toUpperCase();
    statusText.style.color = online ? '#00e676' : state === 'offline' ? '#ff1744' : '';
    ctrlInputs.forEach(el => el.disabled = !online);
  }

  function connect() {
    clearTimeout(reconnectTimer);
    if (ws) { ws.onopen = ws.onclose = ws.onerror = null; ws.close(); ws = null; }

    const ip = ipInput.value.trim();
    if (!ip) { setStatus('offline'); return; }

    setStatus('connecting');
    ws = new WebSocket(`ws://${ip}:${WS_PORT}`);
    ws.binaryType = 'arraybuffer';

    ws.onopen = () => setStatus('online');
    ws.onclose = () => {
      setStatus('offline');
      reconnectTimer = setTimeout(connect, 1500);   // auto-reconnect
    };
    ws.onerror = () => ws.close();
  }

  // ---------- PACKET (8 bytes, little-endian) ----------
  const packetBuf = new ArrayBuffer(8);
  const packetView = new DataView(packetBuf);
  const packetBytes = new Uint8Array(packetBuf);

  function sendPacket() {
    if (!ws || ws.readyState !== WebSocket.OPEN) return;
    if (ws.bufferedAmount > 64) return;   // network is behind: drop this frame instead of queueing lag

    packetView.setUint8(0, 0xA5);
    packetView.setUint8(1, parseInt(sliderS2.value));
    packetView.setUint8(2, parseInt(sliderS3.value));
    packetView.setInt16(3, parseInt(sliderThrottle.value), true);
    packetView.setInt16(5, parseInt(sliderSteering.value), true);

    let x = 0;
    for (let i = 0; i < 7; i++) x ^= packetBytes[i];
    packetView.setUint8(7, x);

    ws.send(packetBuf);
  }

  // ---------- UI ----------
  function updateUI() {
    document.getElementById('valS2').innerText = sliderS2.value + '°';
    document.getElementById('valS3').innerText = sliderS3.value + '°';
    document.getElementById('valThrottle').innerText = sliderThrottle.value;
    document.getElementById('valSteering').innerText = sliderSteering.value;
  }

  [sliderS2, sliderS3, sliderThrottle, sliderSteering].forEach(s => s.addEventListener('input', updateUI));

  // Throttle & steering spring back to 0 when released
  ['pointerup', 'pointercancel', 'touchend', 'mouseup'].forEach(evt => {
    [sliderThrottle, sliderSteering].forEach(s => s.addEventListener(evt, () => {
      s.value = 0;
      updateUI();
      sendPacket();   // send the stop immediately, don't wait for the next tick
    }));
  });

  function resetDrive() {
    sliderThrottle.value = 0;
    sliderSteering.value = 0;
    updateUI();
    sendPacket();
  }

  // Stop the vehicle if the tab is hidden/backgrounded
  document.addEventListener('visibilitychange', () => { if (document.hidden) resetDrive(); });

  ipInput.addEventListener('change', connect);

  // ---------- START ----------
  setStatus('connecting');
  connect();
  setInterval(sendPacket, SEND_INTERVAL_MS);
</script>

</body>
</html>
